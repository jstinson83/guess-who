<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Who Portrait Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/cropper.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Guess Who Portrait Generator</h1>
    <p class="subtitle">Upload a photo, crop it, pick a few traits, and let Gemini turn it into a cartoon portrait.</p>

    <section>
      <label class="field-label" for="fileInput">1. Choose a photo</label>
      <input type="file" id="fileInput" accept="image/*" />
      <div id="cropContainer"><img id="cropImage" alt="" /></div>
    </section>

    <section>
      <label class="field-label">2. Pick a few traits</label>
      <label class="field-hint">Every portrait is drawn as a cartoon automatically — these are optional extra touches.</label>
      <div class="traits" id="traits">
        <label class="switch"><input type="checkbox" value="add glasses" /><span class="switch-track"></span>Glasses</label>
        <label class="switch"><input type="checkbox" value="add sunglasses" /><span class="switch-track"></span>Sunglasses</label>
        <label class="switch"><input type="checkbox" value="add a hat" /><span class="switch-track"></span>Hat</label>
        <label class="switch"><input type="checkbox" value="add a mustache" /><span class="switch-track"></span>Mustache</label>
        <label class="switch"><input type="checkbox" value="add a beard" /><span class="switch-track"></span>Beard</label>
        <label class="switch"><input type="checkbox" value="give them long hair" /><span class="switch-track"></span>Long hair</label>
        <label class="switch"><input type="checkbox" value="give them curly hair" /><span class="switch-track"></span>Curly hair</label>
        <label class="switch"><input type="checkbox" value="give them a bigger nose" /><span class="switch-track"></span>Big nose</label>
        <label class="switch"><input type="checkbox" value="give them freckles" /><span class="switch-track"></span>Freckles</label>
        <label class="switch"><input type="checkbox" value="add earrings" /><span class="switch-track"></span>Earrings</label>
      </div>
    </section>

    <section>
      <button id="generateBtn" disabled>Generate portrait</button>
      <div id="status"></div>
      <img id="resultImg" alt="Generated portrait" />
    </section>
  </main>

  <script src="/vendor/cropper.min.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const cropContainer = document.getElementById('cropContainer');
    const cropImage = document.getElementById('cropImage');
    const generateBtn = document.getElementById('generateBtn');
    const statusEl = document.getElementById('status');
    const resultImg = document.getElementById('resultImg');

    let cropper = null;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      cropImage.src = url;
      cropContainer.style.display = 'block';
      resultImg.style.display = 'none';
      statusEl.textContent = '';
      statusEl.className = '';

      if (cropper) cropper.destroy();
      cropImage.onload = () => {
        cropper = new Cropper(cropImage, { aspectRatio: 1, viewMode: 1 });
        generateBtn.disabled = false;
      };
    });

    generateBtn.addEventListener('click', async () => {
      if (!cropper) return;

      const traits = Array.from(document.querySelectorAll('#traits input:checked')).map((el) => el.value);

      const canvas = cropper.getCroppedCanvas({ width: 768, height: 768 });
      canvas.toBlob(async (blob) => {
        const form = new FormData();
        form.append('image', blob, 'photo.png');
        form.append('traits', JSON.stringify(traits));

        generateBtn.disabled = true;
        statusEl.textContent = 'Generating…';
        statusEl.className = '';
        resultImg.style.display = 'none';

        try {
          const res = await fetch('/api/transform', { method: 'POST', body: form });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Request failed');

          resultImg.src = data.image;
          resultImg.style.display = 'block';
          statusEl.textContent = 'Done.';
        } catch (err) {
          statusEl.textContent = err.message;
          statusEl.className = 'error';
        } finally {
          generateBtn.disabled = false;
        }
      }, 'image/png');
    });
  </script>
</body>
</html>
