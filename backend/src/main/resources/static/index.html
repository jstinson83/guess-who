<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Who Boards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/cropper.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="top-nav">
    <a href="#/" id="navBoards" class="top-nav-link">Boards</a>
    <a href="#/library" id="navLibrary" class="top-nav-link">Photo Library</a>
  </nav>
  <main>
    <!-- Board list -->
    <section id="boardListView">
      <h1>Guess Who Boards</h1>
      <p class="subtitle">Create a board for your group, then add people to it one photo at a time.</p>

      <div class="panel">
        <label class="field-label" for="newBoardName">Create a board</label>
        <div class="new-board-form">
          <input type="text" id="newBoardName" placeholder="Board name (e.g. The Smiths)" />
          <input type="number" id="newBoardTargetSize" value="24" min="2" max="64" title="Target number of characters" />
          <button id="createBoardBtn">Create board</button>
        </div>
        <div id="createBoardStatus" class="status"></div>
      </div>

      <div id="boardList" class="board-list"></div>
    </section>

    <!-- Board detail -->
    <section id="boardDetailView" class="hidden">
      <button class="link-btn" id="backToListBtn">&larr; All boards</button>
      <div class="board-header">
        <div>
          <h1 id="boardName"></h1>
          <p class="subtitle" id="boardMeta"></p>
        </div>
      </div>

      <div class="panel character-panel">
        <div id="characterGrid" class="character-grid"></div>
      </div>

      <details class="panel" id="featureBalancePanel">
        <summary class="field-label">Feature balance</summary>
        <div id="featureBalanceGrid" class="feature-balance-grid"></div>
      </details>

      <div class="board-complete-actions">
        <button id="completeBoardBtn">Mark board complete</button>
        <a class="hidden" id="playBoardBtn" href="">Play</a>
      </div>

      <div class="fab-container" id="fabContainer">
        <input type="file" id="uploadInput" accept="image/*" class="hidden" />
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" />
        <button class="fab-option" id="fabUpload" title="Upload a photo" aria-label="Upload a photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V4" />
            <path d="M7.5 8.5 12 4l4.5 4.5" />
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
          </svg>
        </button>
        <button class="fab-option" id="fabCamera" title="Take a photo" aria-label="Take a photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8a2 2 0 0 1 2-2h1.4l.9-1.4a1 1 0 0 1 .84-.6h5.72a1 1 0 0 1 .84.6L16.6 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" />
            <circle cx="12" cy="13" r="3.2" />
          </svg>
        </button>
        <button class="fab-main" id="fabMain" aria-label="Add a character">+</button>
      </div>
    </section>

    <!-- Crop photo -->
    <section id="cropView" class="hidden">
      <button class="link-btn" id="cropBackBtn">&larr; Cancel</button>
      <h1>Crop photo</h1>
      <p class="subtitle">Frame their face and shoulders, then confirm.</p>
      <div id="cropContainer"><img id="cropImage" alt="" /></div>
      <button id="confirmCropBtn" disabled>Use this crop</button>
      <div id="cropStatus" class="status"></div>
    </section>

    <!-- Pick features -->
    <section id="featuresView" class="hidden">
      <button class="link-btn" id="featuresBackBtn">&larr; Cancel</button>
      <h1>Pick features</h1>

      <div class="panel" id="addCharacterPanel">
        <div id="addCharacterOverlay" class="panel-overlay hidden">
          <div class="spinner"></div>
        </div>

        <label class="field-label">Features</label>
        <label class="field-hint">Features already at their target for this board are greyed out.</label>
        <div class="traits" id="traits"></div>
        <div id="traitsCount" class="status"></div>
        <div id="duplicateWarning" class="status warning hidden"></div>

        <div class="name-and-submit">
          <input type="text" id="personName" placeholder="Their name" required />
          <button id="generateBtn">Create character</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </section>

    <!-- Pass-and-play game: one content container, re-rendered per phase by app.js
         (setup picks, pass-device interstitials, play, game over). -->
    <section id="gameView" class="hidden">
      <button class="link-btn" id="gameBackBtn">&larr; Board</button>
      <div id="gameContent"></div>
    </section>

    <!-- Photo Library: a board-agnostic library of photos + their detected features, browsable
         on its own. Nothing here reads or writes any board. -->
    <section id="libraryView" class="hidden">
      <h1>Photo Library</h1>
      <p class="subtitle">A reusable library of photos, independent of any board.</p>

      <div class="panel photobank-panel" id="photoBankPanel">
        <div id="photoBankOverlay" class="panel-overlay hidden">
          <div class="spinner"></div>
        </div>
        <div id="photoBankGrid" class="character-grid"></div>
      </div>
      <div id="libraryStatus" class="status"></div>

      <div class="fab-container" id="libraryFabContainer">
        <input type="file" id="libraryUploadInput" accept="image/*" class="hidden" />
        <input type="file" id="libraryCameraInput" accept="image/*" capture="environment" class="hidden" />
        <button class="fab-option" id="libraryFabUpload" title="Upload a photo" aria-label="Upload a photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V4" />
            <path d="M7.5 8.5 12 4l4.5 4.5" />
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
          </svg>
        </button>
        <button class="fab-option" id="libraryFabCamera" title="Take a photo" aria-label="Take a photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8a2 2 0 0 1 2-2h1.4l.9-1.4a1 1 0 0 1 .84-.6h5.72a1 1 0 0 1 .84.6L16.6 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" />
            <circle cx="12" cy="13" r="3.2" />
          </svg>
        </button>
        <button class="fab-main" id="libraryFabMain" aria-label="Add a photo">+</button>
      </div>
    </section>
  </main>

  <!-- Character modal: shown on successful create, and when a board tile is clicked -->
  <div id="characterModal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="characterModalTitle"></h2>
      <img id="characterModalPortrait" class="modal-portrait" alt="" />
      <div id="characterModalSubtitle" class="modal-subtitle"></div>
      <button id="characterModalDismissBtn">Done</button>
      <button id="characterModalDeleteBtn" class="link-btn modal-delete-btn hidden">Delete this photo</button>
    </div>
  </div>

  <script src="/vendor/cropper.min.js"></script>
  <script src="/templates.js"></script>
  <script src="/app.js"></script>
</body>
</html>
