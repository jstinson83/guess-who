<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Who Boards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/cropper.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <!-- Board list -->
    <section id="boardListView">
      <h1>Guess Who Boards</h1>
      <p class="subtitle">Create a board for your group, then add people to it one photo at a time.</p>

      <div class="panel">
        <label class="field-label" for="newBoardName">Create a board</label>
        <div class="new-board-form">
          <input type="text" id="newBoardName" placeholder="Board name (e.g. The Smiths)" />
          <input type="number" id="newBoardTargetSize" value="24" min="2" max="64" title="Target number of characters" />
          <button id="createBoardBtn">Create board</button>
        </div>
        <div id="createBoardStatus" class="status"></div>
      </div>

      <div id="boardList" class="board-list"></div>
    </section>

    <!-- Board detail -->
    <section id="boardDetailView" class="hidden">
      <button class="link-btn" id="backToListBtn">&larr; All boards</button>
      <div class="board-header">
        <div>
          <h1 id="boardName"></h1>
          <p class="subtitle" id="boardMeta"></p>
        </div>
        <button id="completeBoardBtn">Mark board complete</button>
      </div>

      <div class="panel">
        <div id="characterGrid" class="character-grid"></div>
      </div>

      <div class="fab-container" id="fabContainer">
        <input type="file" id="uploadInput" accept="image/*" class="hidden" />
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" />
        <button class="fab-option" id="fabUpload" title="Upload a photo">&#128247;</button>
        <button class="fab-option" id="fabCamera" title="Take a photo">&#128248;</button>
        <button class="fab-main" id="fabMain" aria-label="Add a character">+</button>
      </div>
    </section>

    <!-- Crop photo -->
    <section id="cropView" class="hidden">
      <button class="link-btn" id="cropBackBtn">&larr; Cancel</button>
      <h1>Crop photo</h1>
      <p class="subtitle">Frame their face and shoulders, then confirm.</p>
      <div id="cropContainer"><img id="cropImage" alt="" /></div>
      <button id="confirmCropBtn" disabled>Use this crop</button>
    </section>

    <!-- Pick features -->
    <section id="featuresView" class="hidden">
      <button class="link-btn" id="featuresBackBtn">&larr; Cancel</button>
      <h1>Pick features</h1>

      <div class="panel" id="addCharacterPanel">
        <div id="addCharacterOverlay" class="panel-overlay hidden">
          <div class="spinner"></div>
        </div>

        <label class="field-label" for="personName">Their name</label>
        <input type="text" id="personName" placeholder="e.g. Jordan" />

        <label class="field-label">Features</label>
        <label class="field-hint">Features already at their target for this board are greyed out.</label>
        <div class="traits" id="traits"></div>

        <button id="generateBtn">Create character</button>
        <div id="status" class="status"></div>
      </div>
    </section>
  </main>

  <script src="/vendor/cropper.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
